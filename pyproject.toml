[project]
name = "secure-prompt-guard"
version = "0.1.0"
description = "Universal ML classification platform foundation for prompt safety and text mood analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.5.0",
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.9.0",
    "pyyaml>=6.0.2",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "transformers>=4.50.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
    "tavily-cli>=0.1.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
