services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secure_prompt_guard_test
      POSTGRES_USER: secure_prompt_guard
      POSTGRES_PASSWORD: secure_prompt_guard
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_prompt_guard -d secure_prompt_guard_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
